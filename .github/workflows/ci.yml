name: Surcos 360 CI/CD Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend (Typecheck, Lint, Unit & E2E)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run TypeScript Typecheck & Build
        working-directory: ./backend
        run: npm run build

      - name: Run Unit Tests
        working-directory: ./backend
        run: npm test

      - name: Run E2E & Mocked Security Suite
        working-directory: ./backend
        run: npm run test:e2e

  frontend-quality:
    name: Frontend (Typecheck, Lint & Production Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Next.js Production Build
        working-directory: ./frontend
        run: npm run build
